<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Track and manage your Padel games effortlessly with our free web-based app! Perfect for Americano and Mexicano formats.">
        <link rel="icon" href="logo_circular.png" type="image/png">
        <link rel="apple-touch-icon" href="pics/logo.png">
        <link rel="stylesheet" href="css/styles.css">
        <script type="application/ld+json">
            {
              "@context": "https://schema.org",
              "@type": "WebApplication",
              "name": "Padel Score App",
              "url": "https://padelscore.app",
              "description": "A free web application to keep track of padel scores easily and efficiently.",
              "applicationCategory": "GameApplication",
              "operatingSystem": "All", 
              "offers": {
                "@type": "Offer",
                "price": "0.00",
                "priceCurrency": "USD",
                "itemOffered": {
                  "@type": "Service",
                  "serviceType": "Score Tracking for Padel"
                }
              },
              "publisher": {
                "@type": "Organization",
                "name": "PadelScore.app",
                "url": "https://padelscore.app",
                "logo": {
                  "@type": "ImageObject",
                  "url": "https://padelscore.app/logo.png"  // Replace with the actual logo URL
                }
              },
              "potentialAction": {
                "@type": "UseAction",
                "target": "https://padelscore.app",
                "name": "Track Scores"
              }
            }
            </script>
        <title>PadelScore</title>
    </head>
    <body>
        <main>
            <div class="title-container">
                <a href="https://padelscore.app">
                    <img src="pics/logo.png" alt="Padelscore Logo" class="logo">
                </a>
                <a href="https://padelscore.app" class="no-underline">
                    <h1 id="maintitle">PadelScore</h1>
                </a>
                <h2 style="display: none;">Select game setup for you padel match</h2>
            </div>
            <form id="playerForm"></form>
                <fieldset id="type-of-game">
                    <legend class="header">Type of game</legend>
                    <label><input type="radio" value="americano" name="game" checked> Americano</label>
                </fieldset>
                <fieldset id="number-of-points">
                    <legend class="header">Number of points</legend>
                    <label><input type="radio" name="points" value="13"> 13</label>
                    <label><input type="radio" name="points" value="17"> 17</label>
                    <label><input type="radio" name="points" value="19"> 19</label>
                    <label><input type="radio" name="points" value="21" checked> 21</label>
                    <label><input type="radio" name="points" value="23"> 23</label>
                </fieldset>
                <fieldset id="type-of-court">
                    <legend class="header">Type of court(s)</legend>
                    <label><input type="radio" name="court-type" value="single"> Single</label>
                    <label><input type="radio" name="court-type" value="double" checked> Double</label>
                </fieldset>
                <fieldset id="number-of-courts">
                    <legend class="header">Number of court(s)</legend>
                    <label><input type="radio" name="courts" value="1" checked> 1</label>
                    <label><input type="radio" name="courts" value="2"> 2</label>
                    <!--<label><input type="radio" name="courts" value="3"> 3</label>-->
                </fieldset>
                <fieldset id="players">
                    <legend class="header">Players</legend>
                    <div id="playerInputs"></div>
                    <label for="newPlayer">Add player:</label>
                    <input type="text" id="newPlayer" placeholder="Player name" required>
                    <button type="button" id="addButton" onclick="addPlayers()">Add</button>
                    <p id="number-of-players"></p>
                    <!-- Display added player names -->
                    <ul id="playerList"></ul>
                </fieldset>
            </form>
            <div id="errorMessage" style="color: red; display: none;"></div> 
            <div id="startButton-container">
                <!-- Submit button -->
                <button id="startButton" onclick="startGame()">Start</button>
            </div>   
        </main>                
        <div class="bottom-container">
            <p>&copy; 2025 PadelScore.app. <br> All rights reserved.</p>
        </div>
        <script src="js/script.js"></script>
    </body>
</html>
